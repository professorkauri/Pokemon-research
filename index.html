<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Pokemon Research</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css?v=2025-10-07-1" />
</head>

<body class="theme-light">
    <header>
        <div class="brand">Pokemon Research</div>

        <!-- Main view switcher -->
        <div id="mainTabs" class="segmented" role="tablist" aria-label="Main view">
            <div class="seg active" role="tab" aria-selected="true" data-view="search">Search</div>
            <div class="seg" role="tab" aria-selected="false" data-view="browse">Browse All</div>
            <div class="seg" role="tab" aria-selected="false" data-view="games">Games</div>
        </div>

        <div class="text-right">
            <button id="openNotepad" class="btn">Notepad</button>
            <button id="openAdmin" class="btn accent">Admin</button>
        </div>
    </header>

    <main id="main">
        <div class="placeholder">Loading data…</div>
    </main>

    <!-- Admin Overlay (unchanged controls, but updated functions are below) -->
    <div class="overlay" id="overlay" aria-hidden="true">
        <div class="admin-window" role="dialog" aria-modal="true" aria-label="Pokemon Data Admin">
            <div class="admin-header">
                <div class="admin-title">Pokemon Data Admin</div>
                <div class="segmented" id="viewTabs" role="tablist" aria-label="Admin View">
                    <div class="seg active" role="tab" aria-selected="true" data-view="pokemon">Pokemon</div>
                    <div class="seg" role="tab" aria-selected="false" data-view="games">Games</div>
                </div>
                <div class="toolbar">
                    <span class="pill" id="datasetSummary">0 Pokémon • 0 Games</span>
                    <input id="importInput" type="file" accept="application/json" class="hidden" />
                    <button id="importBtn" class="btn" title="Import data.json">Import JSON</button>
                    <button id="downloadBtn" class="btn primary" title="Download all data as JSON">Download
                        JSON</button>
                    <button id="closeAdmin" class="btn">Close</button>
                </div>
            </div>

            <div class="admin-body">
                <div class="left-col">
                    <div class="left-header">
                        <div id="leftTitle">Pokemon</div>
                        <div class="row">
                            <button id="sortBtn" class="btn" title="Toggle sort mode">A–Z</button>
                            <button id="addBtn" class="btn" title="Add new">+</button>
                        </div>
                    </div>
                    <div class="left-search">
                        <input id="leftSearch" type="text" placeholder="Search…" />
                    </div>
                    <div id="leftList" class="list" role="listbox" aria-label="Items list"></div>
                </div>

                <div class="right-col">
                    <div class="right-header">
                        <div id="rightTitle" class="muted">No item selected</div>
                        <div class="toolbar">
                            <button id="deleteBtn" class="btn hidden" title="Delete selected">Delete</button>
                        </div>
                    </div>
                    <div class="right-body" id="rightBody">
                        <div class="muted">Select or add an item to edit its details.</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Public Pokémon Details Overlay -->
    <div class="overlay" id="pkmnOverlay" aria-hidden="true">
        <div class="admin-window" role="dialog" aria-modal="true" aria-label="Pokémon details">
            <div class="admin-header">
                <div class="admin-title" id="pkmnOverlayTitle">Pokémon</div>
                <div class="toolbar">
                    <button id="pkmnOverlayClose" class="btn">Close</button>
                </div>
            </div>
            <div class="right-body" id="pkmnOverlayBody">
                <!-- filled dynamically -->
            </div>
        </div>
    </div>

    <!-- Public Corpus Overlay -->
    <div class="overlay" id="corpusOverlay" aria-hidden="true">
        <div class="admin-window" role="dialog" aria-modal="true" aria-label="Game corpus">
            <div class="admin-header">
                <div class="admin-title" id="corpusOverlayTitle">Corpus</div>
                <label class="goto">
                    Go to line:
                    <input id="gotoLine" type="number" min="1" placeholder="e.g. 128" inputmode="numeric"
                        aria-label="Go to line" />
                    <button id="gotoBtn" class="btn">Go</button>
                </label>
                <div class="toolbar">
                    <button id="corpusOverlayClose" class="btn">Close</button>
                </div>
            </div>
            <div class="right-body" id="corpusOverlayBody">
                <!-- filled dynamically -->
            </div>
        </div>
    </div>

    <!-- Notepad Overlay -->
    <div class="overlay" id="notepadOverlay" aria-hidden="true">
        <div class="admin-window" role="dialog" aria-modal="true" aria-label="Notepad">
            <div class="admin-header">
                <div class="admin-title">Notepad</div>
                <div class="toolbar">
                    <input id="notepadImportInput" type="file" accept="application/json" class="hidden" />
                    <button id="notepadImportBtn" class="btn">Import</button>
                    <button id="notepadDownloadBtn" class="btn primary">Download</button>
                    <button id="notepadClearBtn" class="btn danger">Clear Notepad</button>
                    <button id="notepadClose" class="btn">Close</button>
                </div>
            </div>
            <div class="right-body" id="notepadBody"><!-- filled dynamically --></div>
        </div>
    </div>

    <script>
        const s = document.createElement('link');
        s.rel = 'stylesheet';
        s.href = 'style.css?cb=' + Date.now();
        document.head.appendChild(s);

        /* =======================
           Data & Utilities
           ======================= */
        const TYPE_OPTIONS = ["", "Normal", "Fire", "Water", "Electric", "Grass", "Ice", "Fighting", "Poison", "Ground", "Flying", "Psychic", "Bug", "Rock", "Ghost", "Dragon", "Dark", "Steel", "Fairy"];
        const DEFAULT_DATA = { games: [], pokemon: [] };
        let DATA = structuredClone(DEFAULT_DATA);

        function typeToken(v) { return String(v || "").trim().toLowerCase(); }

        function setTypeData(el, pkmn) {
            const t1 = String(pkmn.type1 || "").trim().toLowerCase();
            const t2 = String(pkmn.type2 || "").trim().toLowerCase() || t1;
            if (t1) el.setAttribute("data-type1", t1); else el.removeAttribute("data-type1");
            if (t2) el.setAttribute("data-type2", t2); else el.removeAttribute("data-type2");
        }

        function setTypeDataAttr(el, attr, value) {
            const v = String(value || "").trim().toLowerCase();
            if (v) el.setAttribute(attr, v);
            else el.removeAttribute(attr);
        }

        // Turn a field label into a CSS-safe class, e.g. "Sp. Attack" -> "field-sp-attack"
        function fieldSlug(label) {
            let s = String(label || "")
                .normalize("NFKD")                      // strip accents (Pokédex -> Pokedex)
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .replace(/&/g, " and ")
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");
            if (!s) s = "unnamed";
            return `field-${s}`;
        }
        function addFieldNameClass(el, label) {
            if (!el) return;
            el.classList.add(fieldSlug(label));
        }

        // Make a Pokémon image clickable: wrap div.img in a button and return it
        function makeClickablePokemonImage(imgEl, p) {
            const btn = document.createElement("button");
            btn.className = "link-btn";
            btn.style.padding = "0";
            btn.style.background = "transparent";
            btn.style.border = "0";
            btn.style.color = "inherit";
            btn.style.cursor = "pointer";
            btn.setAttribute("aria-label", `Open ${p?.name || "Pokémon"} entry`);
            btn.addEventListener("click", () => openPokemonOverlay(p));

            btn.appendChild(imgEl);   // wrap the image div
            return btn;               // <-- IMPORTANT: return wrapper
        }


        let adminActiveView = "pokemon";
        let selectedId = null;
        let leftFilter = "";
        let pokemonSortMode = "AZ"; // "AZ" | "09"
        let gameSortMode = "DATE";  // "DATE" | "AZ"

        let mainView = "search";  // "browse" | "games" | "search"

        const PKMN_IMG = (id) => `images/pkmn/${encodeURIComponent(id)}.webp`;
        const GAME_IMG = (slug) => `images/games/${encodeURIComponent(slug)}.webp`;


        function safeHtml(str) { return String(str ?? "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s])) }
        function escapeRegExp(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        // Returns HTML with <mark class="hl">…</mark> around matches (case-insensitive), safely escaped
        function highlightHTML(text, query) {
            const src = String(text ?? "");
            const q = String(query ?? "").trim();
            if (!q) return safeHtml(src);
            const escaped = safeHtml(src);
            const re = new RegExp("(" + escapeRegExp(q) + ")", "ig");
            return escaped.replace(re, '<mark class="hl">$1</mark>');
        }
        function parseAndQuery(qRaw) {
            const raw = String(qRaw || "");
            let excludes = [];

            // Extract [ ... ] block (optional)
            let rest = raw;
            const m = raw.match(/\[([^\]]*)\]/);
            if (m) {
                const inner = m[1] || "";
                excludes = excludes.concat(
                    inner.split(/[,\s]+/).map(s => s.trim()).filter(Boolean)
                );
                rest = raw.replace(m[0], " "); // remove bracket block from main query
            }

            // Split positives by '+', but also allow inline -excludes
            const parts = rest.split("+").map(s => s.trim()).filter(Boolean);
            const terms = [];
            for (const part of parts) {
                if (!part) continue;
                const bits = part.split(/\s+/);
                const kept = [];
                for (const b of bits) {
                    if (b.startsWith("-") && b.length > 1) {
                        excludes.push(b.slice(1));
                    } else {
                        kept.push(b);
                    }
                }
                if (kept.length) terms.push(kept.join(" "));
            }

            return {
                isAnd: terms.length > 1,
                terms,
                excludes
            };
        }

        function textPassesExcludes(text, excludes) {
            if (!excludes || !excludes.length) return true;
            const hay = String(text || "").toLowerCase();
            return !excludes.some(ex => hay.includes(String(ex).toLowerCase()));
        }


        function textMatchesTerms(text, terms, isAnd) {
            const hay = String(text || "").toLowerCase();
            if (!terms.length) return false;
            if (isAnd) return terms.every(t => hay.includes(t.toLowerCase()));
            return terms.some(t => hay.includes(String(t).toLowerCase()));
        }

        function highlightHTMLMulti(text, terms) {
            const src = String(text ?? "");
            if (!terms || !terms.length) return safeHtml(src);
            const escaped = safeHtml(src);
            // Longest-first alternation to avoid nested highlights
            const sorted = [...terms].sort((a, b) => b.length - a.length)
                .map(t => escapeRegExp(String(t)));
            const re = new RegExp("(" + sorted.join("|") + ")", "ig");
            return escaped.replace(re, '<mark class="hl">$1</mark>');
        }

        function numberOrNull(v) { const n = Number(v); return isNaN(n) ? null : n }
        function numOrNullFromInput(v) { if (v === "" || v === null || v === undefined) return null; const n = Number(v); return isNaN(n) ? null : n }
        function updateDatasetSummary() { document.getElementById("datasetSummary").textContent = `${DATA.pokemon.length} Pokémon • ${DATA.games.length} Games` }

        function byReleaseDateAsc(a, b) {
            const da = Date.parse(a.releaseDate || "1970-01-01");
            const db = Date.parse(b.releaseDate || "1970-01-01");
            return (isNaN(da) ? 0 : da) - (isNaN(db) ? 0 : db);
        }

        function debounce(fn, wait = 250) {
            let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
        }
        const refreshLeftList = debounce(() => renderAdminLeftList(), 250);

        function pkmnImageNameFromId(id) {
            const s = String(id ?? "").trim();
            if (/^\d+$/.test(s)) return s.padStart(4, "0");
            return s;
        }

        // ---------- image loading (memo + lazy) ----------
        const IMG_STATUS = new Map(); // url -> "ok" | "err"

        function applyBg(el, url) {
            if (!url) { el.style.backgroundImage = "none"; return; }
            el.style.backgroundImage = `url("${url}")`;
        }

        function loadBgOnce(url, onOk, onErr) {
            const status = IMG_STATUS.get(url);
            if (status === "ok") { onOk(); return; }
            if (status === "err") { onErr(); return; }
            const img = new Image();
            img.onload = () => { IMG_STATUS.set(url, "ok"); onOk(); };
            img.onerror = () => { IMG_STATUS.set(url, "err"); onErr(); };
            img.src = url; // no cache-busting here – allow browser cache
        }

        // IntersectionObserver: load when near viewport
        const lazyIO = new IntersectionObserver((entries) => {
            for (const e of entries) {
                if (!e.isIntersecting) continue;
                const el = e.target;
                lazyIO.unobserve(el);
                const url = el.dataset.bg || "";
                if (!url) return;
                loadBgOnce(
                    url,
                    () => applyBg(el, url),
                    () => { el.style.backgroundImage = "none"; }
                );
            }
        }, { root: null, rootMargin: "300px", threshold: 0.01 });

        function lazyBg(el, url) {
            if (!url) { el.style.backgroundImage = "none"; return; }
            el.dataset.bg = url;
            // Optional: low-cost placeholder stays until loaded
            lazyIO.observe(el);
        }


        function fixJsonText(text) {
            text = text.replace(/:\s*NaN\b/g, ": null");
            try {
                const tmp = JSON.parse(text);
                if (Array.isArray(tmp)) {
                    const cleaned = tmp.filter(obj => {
                        if (obj && typeof obj === "object") {
                            return Object.values(obj).some(v => v !== null && v !== "" && v !== undefined);
                        }
                        return true;
                    });
                    return JSON.stringify(cleaned);
                }
            } catch (_) { }
            return text;
        }

        function normalizeData(json) {
            const t = (v) => String(v ?? "").trim();
            const out = { games: [], pokemon: [] };

            if (Array.isArray(json.games)) {
                out.games = json.games.map(g => ({
                    id: t(g.id ?? crypto.randomUUID()),
                    title: t(g.title),
                    releaseDate: t(g.releaseDate),
                    console: t(g.console),
                    colorHex: t(g.colorHex || "#888888"),
                    imageSlug: t(g.imageSlug),
                    corpusSlug: t(g.corpusSlug)
                }));
            }

            if (Array.isArray(json.pokemon)) {
                out.pokemon = json.pokemon.map(p => {
                    // NEW: normalize pokedex into { [gameId]: { regionalDexNumber, entry } }
                    let pokedexObj = {};
                    if (Array.isArray(p.pokedex)) {
                        for (const e of p.pokedex) {
                            const gameId = String(e.version ?? e.gameId ?? "").trim();
                            if (!gameId) continue;
                            const entry = String(e.text ?? e.entry ?? "");
                            const regional = String(e.regionalDexNumber ?? e.regional ?? "").trim();
                            pokedexObj[gameId] = { regionalDexNumber: regional, entry };
                        }
                    } else if (p.pokedex && typeof p.pokedex === "object") {
                        // Also normalize any existing object-ish shapes
                        for (const [k, v] of Object.entries(p.pokedex)) {
                            const entry = String((v && (v.entry ?? v.text)) ?? "");
                            const regional = String((v && (v.regionalDexNumber ?? v.regional)) ?? "");
                            pokedexObj[String(k)] = { regionalDexNumber: regional, entry };
                        }
                    }

                    return {
                        id: String(p.id ?? p.ID ?? crypto.randomUUID()).trim(),
                        name: String(p.name ?? p.Name ?? p[" Name"] ?? "").trim(),
                        category: String(p.category ?? p.Category ?? p[" Category"] ?? "").trim(),
                        form: String(p.form ?? p.Form ?? p[" Form"] ?? "").trim(),
                        species: String(p.species ?? p.Species ?? p[" Species"] ?? "").trim(),
                        evolution: String(p.evolution ?? p.Evolution ?? "").trim(),
                        type1: String(p.type1 ?? p.Type1 ?? p[" Type1"] ?? "").trim(),
                        type2: String(p.type2 ?? p.Type2 ?? p[" Type2"] ?? "").trim(),
                        hp: numberOrNull(p.hp ?? p.HP),
                        attack: numberOrNull(p.attack ?? p.Attack),
                        defense: numberOrNull(p.defense ?? p.Defense),
                        spAtk: numberOrNull(p.spAtk ?? p["Sp Atk"] ?? p[" Sp Atk"]),
                        spDef: numberOrNull(p.spDef ?? p["Sp Def"] ?? p[" Sp Def"]),
                        speed: numberOrNull(p.speed ?? p.Speed),
                        pokedex: pokedexObj
                    };
                });
            }
            return out;
        }

        async function loadInitialData() {
            try {
                const res = await fetch("./data.json"); // allow normal HTTP caching on GitHub Pages
                if (!res.ok) throw new Error("HTTP " + res.status);
                let raw = await res.text();
                let json;
                try { json = JSON.parse(raw); } catch { raw = fixJsonText(raw); json = JSON.parse(raw); }
                DATA = Array.isArray(json) ? normalizeData({ pokemon: json, games: [] }) : normalizeData(json);
            } catch (e) {
                console.warn("Could not auto-load data.json. Use Import JSON if opening via file://", e);
            }
            updateDatasetSummary();
            renderMain();
        }





        /* =======================
   Notepad: state & helpers
   ======================= */
        const NP_STORAGE_KEY = "pkmn_notepad_v1";
        let NOTEPAD = { textHtml: "", items: [] };
        // item shapes:
        // { id, kind:"dex", pId, pName, pForm, pType1, pType2, gameId, gameTitle, gameConsole, releaseDate, gameColorHex, regionalDexNumber, entry }
        // { id, kind:"corpus", gameId, gameTitle, gameConsole, releaseDate, gameColorHex, corpusSlug, lineNumber, lineText }

        function loadNotepadFromStorage() {
            try {
                const raw = localStorage.getItem(NP_STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === "object") NOTEPAD = { textHtml: parsed.textHtml || "", items: Array.isArray(parsed.items) ? parsed.items : [] };
            } catch { }
        }
        function saveNotepad() {
            try { localStorage.setItem(NP_STORAGE_KEY, JSON.stringify(NOTEPAD)); } catch { }
        }

        /* Open/close & DOM refs */
        const notepadOverlay = document.getElementById("notepadOverlay");
        const notepadBody = document.getElementById("notepadBody");
        const notepadClose = document.getElementById("notepadClose");
        const notepadImport = document.getElementById("notepadImportBtn");
        const notepadImportInput = document.getElementById("notepadImportInput");
        const notepadDownload = document.getElementById("notepadDownloadBtn");
        const openNotepadBtn = document.getElementById("openNotepad");

        const notepadClearBtn = document.getElementById("notepadClearBtn");
        let npClearArmed = false;

        function resetNotepadClearButton() {
            npClearArmed = false;
            if (!notepadClearBtn) return;
            notepadClearBtn.classList.remove("notepad_warning");
            notepadClearBtn.textContent = "Clear Notepad";
        }

        notepadClearBtn?.addEventListener("click", () => {
            if (!npClearArmed) {
                npClearArmed = true;
                notepadClearBtn.classList.add("notepad_warning");
                notepadClearBtn.textContent = "Are you sure?";
                return;
            }
            // Second click -> clear everything
            NOTEPAD.textHtml = "";
            NOTEPAD.items = [];
            saveNotepad();
            renderNotepad();
            resetNotepadClearButton();
        });

        function openNotepadOverlay() {
            renderNotepad();
            notepadOverlay.classList.add("open");
            notepadOverlay.setAttribute("aria-hidden", "false");
        }
        function closeNotepadOverlay() {
            notepadOverlay.classList.remove("open");
            notepadOverlay.setAttribute("aria-hidden", "true");
            resetNotepadClearButton();
        }

        openNotepadBtn?.addEventListener("click", openNotepadOverlay);
        notepadOverlay?.addEventListener("click", (e) => { if (e.target === notepadOverlay) closeNotepadOverlay(); });
        notepadClose?.addEventListener("click", closeNotepadOverlay);
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && notepadOverlay.classList.contains("open")) closeNotepadOverlay();
        });

        /* Import / Download */
        notepadImport?.addEventListener("click", () => notepadImportInput.click());
        notepadImportInput?.addEventListener("change", async () => {
            const file = notepadImportInput.files?.[0]; if (!file) return;
            try {
                const text = await file.text();
                const data = JSON.parse(text);
                if (!data || typeof data !== "object") throw new Error("Invalid JSON");
                NOTEPAD = {
                    textHtml: String(data.textHtml || ""),
                    items: Array.isArray(data.items) ? data.items : []
                };
                saveNotepad();
                renderNotepad();
            } catch (e) { alert("Import failed: " + (e?.message || e)); }
            finally { notepadImportInput.value = ""; }
        });

        notepadDownload?.addEventListener("click", () => {
            const blob = new Blob([JSON.stringify(NOTEPAD, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = "notepad.json";
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
        });

        /* Add / Remove API (call these from Search & Overlay) */
        function addDexToNotepad({ p, game, entryText, regionalDexNumber }) {
            if (!p || !game || !entryText) return;
            const item = {
                id: crypto.randomUUID(),
                kind: "dex",
                pId: p.id || "",
                pName: p.name || "",
                pForm: p.form || "",
                pType1: p.type1 || "",
                pType2: p.type2 || "",
                gameId: game.id || "",
                gameTitle: game.title || "",
                gameConsole: game.console || "",
                releaseDate: game.releaseDate || "",
                gameColorHex: (game.colorHex && /^#[0-9a-f]{6}$/i.test(game.colorHex)) ? game.colorHex.toUpperCase() : "#888888",
                regionalDexNumber: regionalDexNumber || "",
                entry: String(entryText || "")
            };
            NOTEPAD.items.push(item);
            saveNotepad();
            const wasOpen = notepadOverlay.classList.contains("open");
            if (wasOpen) renderNotepad();
            else openNotepadOverlay();
        }

        function addCorpusToNotepad({ game, lineNumber, lineText }) {
            if (!game || !lineNumber || !lineText) return;
            const item = {
                id: crypto.randomUUID(),
                kind: "corpus",
                gameId: game.id || "",
                gameTitle: game.title || "",
                gameConsole: game.console || "",
                releaseDate: game.releaseDate || "",
                gameColorHex: (game.colorHex && /^#[0-9a-f]{6}$/i.test(game.colorHex)) ? game.colorHex.toUpperCase() : "#888888",
                corpusSlug: game.corpusSlug || "",
                lineNumber: lineNumber,
                lineText: String(lineText || "")
            };
            NOTEPAD.items.push(item);
            saveNotepad();
            const wasOpen = notepadOverlay.classList.contains("open");
            if (wasOpen) renderNotepad();
            else openNotepadOverlay();
        }

        function removeNotepadItem(id) {
            const i = NOTEPAD.items.findIndex(x => x.id === id);
            if (i >= 0) {
                NOTEPAD.items.splice(i, 1);
                saveNotepad();
                if (notepadOverlay.classList.contains("open")) renderNotepad();
            }
        }

        /* Rendering */
        function renderNotepad() {
            notepadBody.innerHTML = "";

            // Free-typing block
            const textSection = document.createElement("div");
            textSection.className = "subsection";
            textSection.innerHTML = `<h4>Notes</h4>`;
            const editor = document.createElement("div");
            editor.id = "npText";
            editor.contentEditable = "true";
            editor.style.minHeight = "140px";
            editor.style.border = "1px solid var(--border)";
            editor.style.borderRadius = "10px";
            editor.style.padding = "10px";
            editor.style.outline = "none";
            editor.innerHTML = NOTEPAD.textHtml || "";
            editor.addEventListener("input", () => { NOTEPAD.textHtml = editor.innerHTML; saveNotepad(); });
            textSection.appendChild(editor);
            notepadBody.appendChild(textSection);

            // Saved items
            const itemsSection = document.createElement("div");
            itemsSection.className = "subsection";
            itemsSection.innerHTML = `<h4>Saved items</h4>`;
            const mount = document.createElement("div");
            mount.className = "results";

        function setupNotepadDrag(container) {
            let draggingEl = null;

            container.addEventListener("dragstart", (e) => {
                const card = e.target.closest(".result");
                if (!card) return;
                draggingEl = card;
                card.classList.add("dragging");
                e.dataTransfer.effectAllowed = "move";
                // A small transparent drag image prevents odd ghosting on some browsers
                const img = new Image(); img.src = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
                e.dataTransfer.setDragImage(img, 0, 0);
            });

            container.addEventListener("dragover", (e) => {
                e.preventDefault();
                const after = getDragAfterElement(container, e.clientY);
                const current = container.querySelector(".result.dragging");
                if (!current) return;
                if (!after) container.appendChild(current);
                else container.insertBefore(current, after);
            });

            container.addEventListener("drop", (e) => {
                e.preventDefault();
                persistNotepadOrderFromDOM(container);
            });

            container.addEventListener("dragend", () => {
                const d = container.querySelector(".result.dragging");
                if (d) d.classList.remove("dragging");
                persistNotepadOrderFromDOM(container);
                draggingEl = null;
            });
        }

        function getDragAfterElement(container, y) {
            const cards = [...container.querySelectorAll(".result:not(.dragging)")];
            return cards.reduce(
                (closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - (box.top + box.height / 2);
                    return offset < 0 && offset > closest.offset
                        ? { offset, element: child }
                        : closest;
                },
                { offset: Number.NEGATIVE_INFINITY, element: null }
            ).element;
        }

        function persistNotepadOrderFromDOM(container) {
            const orderIds = [...container.querySelectorAll(".result")]
                .map(el => el.dataset.id)
                .filter(Boolean);
            if (!orderIds.length) return;
            const map = new Map(NOTEPAD.items.map(it => [it.id, it]));
            NOTEPAD.items = orderIds.map(id => map.get(id)).filter(Boolean);
            saveNotepad();
        }

        const CORPUS_CACHE = new Map(); // slug -> { lines: string[], text: string }

        async function loadCorpus(slug) {
            slug = String(slug || "").trim();
            if (!slug) return { lines: [], text: "" };
            if (CORPUS_CACHE.has(slug)) return CORPUS_CACHE.get(slug);

            const url = `corpus/${encodeURIComponent(slug)}.txt`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("HTTP " + res.status);
                // raw text (may contain literal "\n" "\r" "\c" tokens)
                const text = await res.text();

                // 1) remove actual CR characters
                // 2) split on actual newlines
                // 3) for each line, replace literal \n \r \c tokens with a space
                // 4) collapse whitespace
                const lines = text
                    .replace(/\r/g, "")
                    .split("\n")
                    .map(l =>
                        l
                            .replace(/\\[nrc]/g, " ")  // literal "\n" "\r" "\c" -> space
                            .replace(/\s+/g, " ")      // collapse
                            .trim()
                    );

                const value = { lines, text };
                CORPUS_CACHE.set(slug, value);
                return value;
            } catch (e) {
                const value = { lines: [], text: "" };
                CORPUS_CACHE.set(slug, value);
                return value;
            }
        }

        function setupGotoLine() {
            const overlay = document.querySelector('#corpusOverlay') || document;
            const input = document.getElementById('gotoLine');
            const btn = document.getElementById('gotoBtn');
            if (!overlay || !input) return;

            // Keep track of the currently highlighted element
            let lastHighlighted = null;

            function findLine(n) {
                return (
                    overlay.querySelector(`[data-line="${n}"]`) ||
                    overlay.querySelector(`#L${n}`) ||
                    overlay.querySelector(`.line[data-ln="${n}"]`) ||
                    (function () {
                        const candidates = overlay.querySelectorAll(
                            '[data-line], [data-ln], .line, .corpus_line'
                        );
                        if (!candidates.length) return null;
                        const idx = Math.max(1, Math.min(n, candidates.length)) - 1;
                        return candidates[idx] || null;
                    })()
                );
            }

            function jumpToLine(n) {
                if (!Number.isFinite(n) || n < 1) return;
                const el = findLine(n);
                if (!el) return;

                el.scrollIntoView({ block: 'center', behavior: 'smooth' });

                // Toggle persistent highlight (no animation)
                if (lastHighlighted && lastHighlighted !== el) {
                    lastHighlighted.classList.remove('line-highlight');
                }
                el.classList.add('line-highlight');
                lastHighlighted = el;
            }

            // Press Enter to jump
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const n = parseInt(input.value, 10);
                    jumpToLine(n);
                }
            });

            // Click the "Go" button to jump
            if (btn) {
                btn.addEventListener('click', () => {
                    const n = parseInt(input.value, 10);
                    jumpToLine(n);
                });
            }

            // Auto-focus when overlay opens
            const observer = new MutationObserver(() => {
                if (overlay.classList.contains('open')) {
                    input.focus();
                    input.select();
                }
            });
            observer.observe(overlay, { attributes: true, attributeFilter: ['class'] });
        }

        /**
         * Renders search results into a mount element.
         * Options:
         *  - excludePokemonId: string | null  -> skip this Pokémon in results
         *  - compact: boolean                 -> hide the summary line and tighten spacing
         */
        async function renderSearchResultsInto({ query, mountEl, excludePokemonId = null, compact = false }) {
            const qRaw = String(query || "");
            const { isAnd, terms, excludes } = parseAndQuery(qRaw);
            mountEl.innerHTML = "";
            if (!qRaw.trim() || !terms.some(t => t.trim().length)) return;

            // Build a quick lookup for game release dates/titles
            const gameById = Object.create(null);
            for (const g of DATA.games) gameById[g.id] = g;

            const results = document.createElement("div");
            results.className = "results";
            mountEl.appendChild(results);

            // ---------- Pokémon scan (same as renderSearch, with an optional exclusion) ----------
            const hits = [];
            for (const p of DATA.pokemon) {
                if (excludePokemonId && String(p.id) === String(excludePokemonId)) continue;

                let relevancy = 0;
                const fieldMatches = [];

                const fields = {
                    id: p.id, name: p.name, category: p.category, form: p.form, species: p.species,
                    evolution: p.evolution, type1: p.type1, type2: p.type2
                };
                const combined = Object.values(fields).map(v => String(v || "")).join(" | ");
                if (!textPassesExcludes(combined, excludes)) continue; // 🔹 drop if any exclude appears across fields
                // AND-search gate across all core fields so "A + B" can span fields (e.g., name + form)
                if (isAnd) {
                    const qualifies = textMatchesTerms(combined, terms, /*AND*/ true);
                    if (!qualifies) continue; // skip this Pokémon if it doesn't contain all terms across its fields
                }

                for (const [k, v] of Object.entries(fields)) {
                    const s = String(v || "");
                    if (s && textMatchesTerms(s, terms, /*OR within a single field*/ false)) {
                        relevancy++;
                        fieldMatches.push({ label: k, value: s });
                    }
                }

                // Pokédex entries (oldest per unique text)
                const pdx = p.pokedex || {};
                const dexMatchesByText = new Map();
                for (const [gameId, obj] of Object.entries(pdx)) {
                    const entry = obj && obj.entry ? String(obj.entry) : "";
                    if (!entry) continue;
                    if (textMatchesTerms(entry, terms, isAnd) && textPassesExcludes(entry, excludes)) {
                        relevancy++;
                        const textKey = entry.trim().replace(/\s+/g, " ");
                        const g = gameById[gameId];
                        const dateMs = g && g.releaseDate ? Date.parse(g.releaseDate) : Number.POSITIVE_INFINITY;
                        const cur = dexMatchesByText.get(textKey);
                        if (!cur || dateMs < cur.dateMs) dexMatchesByText.set(textKey, { gameId, entry, dateMs });
                    }
                }

                if (relevancy > 0) {
                    hits.push({
                        p,
                        relevancy,
                        fieldMatches,
                        dexMatches: Array.from(dexMatchesByText.values()).sort((a, b) => a.dateMs - b.dateMs)
                    });
                }
            }

            hits.sort((A, B) => (B.relevancy - A.relevancy) || idComparator(A.p, B.p));

            for (const h of hits) {
                const { p, fieldMatches, dexMatches } = h;

                const card = document.createElement("div");
                card.className = "result";
                setTypeData(card, p);

                const header = document.createElement("div");
                header.className = "result-header";

                // clickable image
                const imgBtn = document.createElement("button");
                imgBtn.className = "link-btn";

        // Shared ID sort (0–9 + suffix so 9, 9GM, 9M etc.)
        function parseIdForSort(raw) {
            const id = (raw || "").toString().trim();
            const m = id.match(/^(\d+)(.*)$/);
            if (m) return { num: parseInt(m[1], 10), suffix: m[2] || "" };
            return { num: Number.POSITIVE_INFINITY, suffix: id };
        }
        function idComparator(a, b) {
            const A = parseIdForSort(a.id), B = parseIdForSort(b.id);
            if (A.num !== B.num) return A.num - B.num;
            if (A.suffix === B.suffix) return 0;
            if (A.suffix === "") return -1;
            if (B.suffix === "") return 1;
            return A.suffix.localeCompare(B.suffix, undefined, { sensitivity: "base" });
        }

        function makeField(label, type, value, onChange, opts = {}) {
            const container = document.createElement("div"); container.className = "field";

            const lab = document.createElement("label"); lab.textContent = label; container.appendChild(lab);

            if (type === "select") {
                input = document.createElement("select");
                for (const opt of (opts.options || [])) {
                    const o = document.createElement("option"); o.value = opt; o.textContent = opt || "—"; if (String(value) === String(opt)) o.selected = true;
                    input.appendChild(o);
                }
            } else if (type === "textarea") {
                input = document.createElement("textarea"); input.value = value || "";
            } else {
                input = document.createElement("input"); input.type = type; if (value !== null && value !== undefined) input.value = String(value);
            }
            input.addEventListener("input", () => onChange(type === "number" ? numOrNullFromInput(input.value) : input.value));
            container.appendChild(input);
            return { container, input };
        }

                prevBox.className = "field";
                addFieldNameClass(prevBox, "Image");
                const prevLabel = document.createElement("label");
                prevLabel.textContent = "Image";
                const prev = document.createElement("div");
                prev.className = "img-preview";

                prevBox.appendChild(prevLabel);
                prevBox.appendChild(prev);
                basicGrid.appendChild(prevBox);

                function updatePrev() {
                    const id = (p.id || "").trim();
                    const url = id ? PKMN_IMG(id) : "";
                    if (!url) { prev.style.backgroundImage = "none"; return; }
                    loadBgOnce(url, () => applyBg(prev, url), () => { prev.style.backgroundImage = "none"; });
                }

                // ID
                basicGrid.appendChild(
                    makeField("ID", "text", p.id ?? "", (val) => {
                        p.id = val;
                        refreshLeftList();
                        updatePrev();
                    }).container
                );

                // Name
                basicGrid.appendChild(
                    makeField("Name", "text", p.name ?? "", (val) => {
                        p.name = val;
                        rightTitle.textContent = p.name || "(new Pokémon)";
                        refreshLeftList();
                    }).container
                );

                // Form
                basicGrid.appendChild(
                    makeField("Form", "text", p.form ?? "", (val) => {
                        p.form = val;
                        refreshLeftList();
                    }).container
                );

                basic.appendChild(basicGrid);

                // ============ SECONDARY INFO ============ //
                const secondary = document.createElement("div");
                secondary.className = "subsection";
                secondary.innerHTML = `<h4>Secondary Info</h4>`;
                const secondaryGrid = document.createElement("div");
                secondaryGrid.className = "field-grid";

                // Type 1 / Type 2 (with data-type1 / data-type2 on the <select>)
                const type1Field = makeField(
                    "Type 1", "select", p.type1 ?? "",
                    (val) => { p.type1 = val; },
                    { options: TYPE_OPTIONS }
                );
                const type2Field = makeField(
                    "Type 2", "select", p.type2 ?? "",
                    (val) => { p.type2 = val; },
                    { options: TYPE_OPTIONS }
                );

                // Initial set on first render
                setTypeDataAttr(type1Field.input, "data-type1", p.type1);
                setTypeDataAttr(type2Field.input, "data-type2", p.type2);

                // Keep in sync when the user changes the select
                type1Field.input.addEventListener("change", () => {
                    setTypeDataAttr(type1Field.input, "data-type1", type1Field.input.value);
                });
                type2Field.input.addEventListener("change", () => {
                    setTypeDataAttr(type2Field.input, "data-type2", type2Field.input.value);
                });

                // Append to the grid
                secondaryGrid.appendChild(type1Field.container);
                secondaryGrid.appendChild(type2Field.container);


                // Evolution
                secondaryGrid.appendChild(
                    makeField("Evolution", "text", p.evolution ?? "", (val) => { p.evolution = val; }).container
                );

                // Species
                secondaryGrid.appendChild(
                    makeField("Species", "text", p.species ?? "", (val) => { p.species = val; }).container
                );

                secondary.appendChild(secondaryGrid);

                // ============ STATS ============ //
                const stats = document.createElement("div");
                stats.className = "subsection";
                stats.innerHTML = `<h4>Stats</h4>`;
                const statsGrid = document.createElement("div");
                statsGrid.className = "field-grid";

                statsGrid.appendChild(makeField("HP", "number", (p.hp ?? ""), (val) => { p.hp = val; }).container);
                statsGrid.appendChild(makeField("Attack", "number", (p.attack ?? ""), (val) => { p.attack = val; }).container);
                statsGrid.appendChild(makeField("Defence", "number", (p.defense ?? ""), (val) => { p.defense = val; }).container);
                statsGrid.appendChild(makeField("Sp. Attack", "number", (p.spAtk ?? ""), (val) => { p.spAtk = val; }).container);
                statsGrid.appendChild(makeField("Sp. Defence", "number", (p.spDef ?? ""), (val) => { p.spDef = val; }).container);
                statsGrid.appendChild(makeField("Speed", "number", (p.speed ?? ""), (val) => { p.speed = val; }).container);

                stats.appendChild(statsGrid);

                // ============ APPEND GROUPS TO RIGHT PANEL ============ //
                const body = document.getElementById("rightBody");
                body.innerHTML = "";
                body.appendChild(basic);
                body.appendChild(secondary);
                body.appendChild(stats);

                // ============ POKÉDEX ENTRIES (unchanged) ============ //
                const pdx = document.createElement("div");
                pdx.className = "subsection";
                pdx.innerHTML = `<h4>Pokédex Entries (linked to Games)</h4>`;
                const grid = document.createElement("div");
                grid.className = "pokedex-grid";

                const sortedGames = DATA.games.slice().sort(byReleaseDateAsc);
                if (sortedGames.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "muted";
                    empty.textContent = "No games defined yet.";
                    grid.appendChild(empty);
                } else {
                    for (const g of sortedGames) {
                        const card = document.createElement("div");
                        card.className = "pokedex-card";
                        const gameColor = g.colorHex && /^#[0-9a-f]{6}$/i.test(g.colorHex) ? g.colorHex.toUpperCase() : "#888888";
                        card.setAttribute("style", `--dex_color:${gameColor}`);

                        const title = document.createElement("div");
                        title.className = "pokedex-card-title";
                        title.innerHTML = `<strong>${safeHtml(g.title || "(untitled)")}</strong>`;

                        const fwrap = document.createElement("div");
                        fwrap.className = "field-grid";

                        // ensure per-game pokedex bucket exists
                        const pd = (p.pokedex[g.id] ||= { regionalDexNumber: "", entry: "" });

                        // ⬇️ MOVE Regional Dex Number into the title row
                        const rdField = makeField(
                            "Regional Dex Number",
                            "text",
                            pd.regionalDexNumber,
                            (val) => { pd.regionalDexNumber = val; },
                            { className: "field-regional-dex-number" }
                        ).container;
                        rdField.classList.add("field-inline"); // optional styling hook
                        title.appendChild(rdField);

                        card.appendChild(title);

                        // ⬇️ Leave only the Pokédex Entry in the field grid
                        fwrap.appendChild(
                            makeField("Pokédex Entry", "textarea", pd.entry, (val) => { pd.entry = val; }).container
                        );

                        card.appendChild(fwrap);
                        grid.appendChild(card);
                    }

                }
                pdx.appendChild(grid);
                body.appendChild(pdx);

                // kick off preview
                updatePrev();


            } else {
                const g = DATA.games.find(x => x.id === selectedId); if (!g) return;
                rightTitle.textContent = g.title || "(untitled game)";
                const wrap = document.createElement("div"); wrap.className = "field-grid";

                // Title / Release / Console
                wrap.appendChild(makeField("Title", "text", g.title, (val) => { g.title = val; rightTitle.textContent = g.title || "(untitled game)"; refreshLeftList(); }).container);
                wrap.appendChild(makeField("Release Date", "date", g.releaseDate, (val) => { g.releaseDate = val; refreshLeftList(); }).container);
                wrap.appendChild(makeField("Console", "text", g.console, (val) => { g.console = val; }).container);

                // === Theme Colour: synced picker + hex input ===
                (function () {
                    const field = document.createElement("div"); field.className = "field";
                    addFieldNameClass(field, "Theme Colour");
                    const lab = document.createElement("label"); lab.textContent = "Theme Colour (picker + hex)";
                    const row = document.createElement("div"); row.className = "row";

                    // colour picker
                    const pick = document.createElement("input");
                    pick.type = "color";
                    pick.value = /^#[0-9a-fA-F]{6}$/.test(g.colorHex || "") ? g.colorHex : "#888888";
                    pick.style.width = "44px";
                    pick.style.height = "36px";
                    pick.style.border = "1px solid var(--border)";
                    pick.style.borderRadius = "8px";
                    pick.style.background = "transparent";
                    pick.style.padding = "0";

                    // hex textbox
                    const hex = document.createElement("input");
                    hex.type = "text";
                    hex.value = g.colorHex || "#888888";
                    hex.placeholder = "#RRGGBB";
                    hex.style.flex = "1";
                    hex.style.marginLeft = "10px";
                    hex.style.borderRadius = "10px";
                    hex.addEventListener("input", () => {
                        const v = hex.value.trim();
                        const norm = normalizeHex(v);
                        if (norm) {
                            g.colorHex = norm;
                            pick.value = norm;
                            hex.style.borderColor = "var(--border)";
                            refreshLeftList();
                        } else {
                            // visual hint if invalid
                            hex.style.borderColor = "var(--danger)";
                        }
                    });

                    pick.addEventListener("input", () => {
                        const v = pick.value;
                        g.colorHex = v;
                        hex.value = v.toUpperCase();
                        hex.style.borderColor = "var(--border)";
                        refreshLeftList();
                    });

                    row.appendChild(pick);
                    row.appendChild(hex);
                    field.appendChild(lab);
                    field.appendChild(row);
                    wrap.appendChild(field);

                    function normalizeHex(v) {
                        // Accept formats: #RRGGBB or RRGGBB (case-insensitive)
                        if (/^#[0-9a-fA-F]{6}$/.test(v)) return v.toUpperCase();
                        if (/^[0-9a-fA-F]{6}$/.test(v)) return ("#" + v).toUpperCase();
                        return null;
                    }
                })();

                // === Image slug + preview (preview LEFT of field) ===
                const slugField = makeField("Image Slug (images/games/slug.webp)", "text", g.imageSlug, (val) => { g.imageSlug = val; updateGamePrev(); refreshLeftList(); }, { className: "field-image-slug" });
                const slugRow = document.createElement("div");
                slugRow.className = "row";
                const gPrev = document.createElement("div");
                gPrev.className = "img-preview";
                const fieldWrap = document.createElement("div");
                fieldWrap.style.flex = "1";
                fieldWrap.appendChild(slugField.container);
                slugRow.appendChild(gPrev);
                slugRow.appendChild(fieldWrap);
                wrap.appendChild(slugRow);

                const corpusField = makeField(
                    "Corpus Slug (corpus/slug.txt)",
                    "text",
                    g.corpusSlug ?? "",
                    (val) => { g.corpusSlug = val; }, { className: "field-corpus-slug" }
                );
                wrap.appendChild(corpusField.container);

                function updateGamePrev() {
                    const slug = (g.imageSlug || "").trim();
                    const url = slug ? GAME_IMG(slug) : "";
                    if (!url) { gPrev.style.backgroundImage = "none"; return; }
                    loadBgOnce(url, () => applyBg(gPrev, url), () => { gPrev.style.backgroundImage = "none"; });
                }

                body.appendChild(wrap);
                updateGamePrev();
            }
        }

        function renderGameCatalog(game) {
            // Header with game details
            const header = document.createElement("div");
            header.className = "subsection";
            const gColor = game.colorHex && /^#[0-9a-f]{6}$/i.test(game.colorHex) ? game.colorHex.toUpperCase() : "#888888";
            header.setAttribute("style", `--dex_color:${gColor}`);

            const headTop = document.createElement("div");

            const hTitle = document.createElement("div");
            hTitle.innerHTML = `<strong style="font-size:18px">${safeHtml(game.title || "(Untitled)")}</strong>`;
            const back = document.createElement("button");
            back.className = "btn";
            back.textContent = "← Back to Games";
            back.addEventListener("click", () => { mainView = "games"; renderMain(); });
            headTop.appendChild(hTitle);
            if ((game.corpusSlug || "").trim()) {
                const corpusBtn = document.createElement("button");
                corpusBtn.className = "btn accent";
                corpusBtn.textContent = "View Corpus";
                corpusBtn.addEventListener("click", () => openCorpusOverlayForGame(game));
                headTop.appendChild(corpusBtn);
            }

            headTop.appendChild(back);

            const meta = document.createElement("div");
            meta.className = "row muted";
            const date = game.releaseDate ? new Date(game.releaseDate).toISOString().slice(0, 10) : "—";
            meta.innerHTML = `<span class="pill">${safeHtml(game.console || "—")}</span><span class="pill">${safeHtml(date)}</span>`;

            const hero = document.createElement("div");
            hero.className = "game-img";
            if (game.imageSlug) lazyBg(hero, GAME_IMG(game.imageSlug));

            header.appendChild(headTop);
            header.appendChild(meta);
            header.appendChild(hero);

            // Filter Pokémon that have an entry OR a regional dex number for this game
            const filtered = DATA.pokemon.filter(p => {
                const pd = p.pokedex?.[game.id];
                if (!pd) return false;
                const hasEntry = !!(pd.entry && String(pd.entry).trim());
                const hasRegional = !!(pd.regionalDexNumber && String(pd.regionalDexNumber).trim());
                return hasEntry || hasRegional;
            });

            // Sort: regional dex number (numeric, missing last), then name
            filtered.sort((a, b) => {
                const ad = parseInt(a.pokedex?.[game.id]?.regionalDexNumber || "", 10);
                const bd = parseInt(b.pokedex?.[game.id]?.regionalDexNumber || "", 10);
                const aHas = !isNaN(ad), bHas = !isNaN(bd);
                if (aHas && bHas && ad !== bd) return ad - bd;
                if (aHas !== bHas) return aHas ? -1 : 1;
                return (a.name || "").localeCompare(b.name || "", undefined, { sensitivity: "base" });
            });

            // Grid like Browse
            const grid = document.createElement("div");
            grid.className = "grid";
            for (const p of filtered) {
                const card = document.createElement("div");
                card.className = "card";
                setTypeData(card, p);

                // Image (click to open overlay)
                const img = document.createElement("div");
                img.className = "img";
                lazyBg(img, PKMN_IMG(p.id));
                const imgBtn = img; // use same naming so the pattern matches elsewhere
                imgBtn.style.cursor = "pointer";
                imgBtn.addEventListener("click", () => openPokemonOverlay(p));
                card.appendChild(imgBtn);

                // Title (name clickable) + form
                const title = document.createElement("div");
                const nameBtn = document.createElement("button");
                nameBtn.className = "link-btn";
                nameBtn.innerHTML = `<strong>${safeHtml(p.name || "(Unnamed)")}</strong>`;
                nameBtn.addEventListener("click", () => openPokemonOverlay(p));

                const formSpan = document.createElement("span");
                formSpan.className = "muted";
                formSpan.textContent = p.form || "";

                title.appendChild(nameBtn);
                title.appendChild(document.createTextNode(" "));
                title.appendChild(formSpan);

                // Meta
                const meta = document.createElement("div");
                meta.className = "row muted";
                const pd = p.pokedex?.[game.id] || {};
                const dexNo = (pd.regionalDexNumber && String(pd.regionalDexNumber).trim()) ? `#${pd.regionalDexNumber}` : "—";
                let typeHTML = "";
                if (p.type1 && p.type2) {
                    typeHTML = `<p class="pill pill-types"><span data-type1="${safeHtml(p.type1.toLowerCase())}">${safeHtml(p.type1)}</span> <span data-type2="${safeHtml(p.type2.toLowerCase())}">${safeHtml(p.type2)}</span></p>`;
                } else if (p.type1) {
                    typeHTML = `<p class="pill pill-types"><span data-type1="${safeHtml(p.type1.toLowerCase())}">${safeHtml(p.type1)}</span></p>`;
                } else {
                    typeHTML = `<p class="pill">—</p>`;
                }

                meta.innerHTML = `<span class="pill">${safeHtml(dexNo)}</span>${typeHTML}`;

                card.appendChild(title);
                card.appendChild(meta);
                grid.appendChild(card);
            }

            mainEl.innerHTML = "";
            mainEl.appendChild(header);
            mainEl.appendChild(grid);
        }


        // Kick off
        loadInitialData();
    </script>
</body>

</html>
