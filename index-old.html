        <div class="admin-window" role="dialog" aria-modal="true" aria-label="Pokemon Data Admin">

                <div class="toolbar">
                    <input id="importInput" type="file" accept="application/json" class="hidden" />

                    <button id="closeAdmin" class="btn">Close</button>

    <script>
        const s = document.createElement('link');
        s.rel = 'stylesheet';
        s.href = 'style.css?cb=' + Date.now();
        document.head.appendChild(s);

        /* =======================
           Data & Utilities
           ======================= */
        const TYPE_OPTIONS = ["", "Normal", "Fire", "Water", "Electric", "Grass", "Ice", "Fighting", "Poison", "Ground", "Flying", "Psychic", "Bug", "Rock", "Ghost", "Dragon", "Dark", "Steel", "Fairy"];
        const DEFAULT_DATA = { games: [], pokemon: [] };
        let DATA = structuredClone(DEFAULT_DATA);

        function typeToken(v) { return String(v || "").trim().toLowerCase(); }

        function setTypeData(el, pkmn) {
            const t1 = String(pkmn.type1 || "").trim().toLowerCase();
            const t2 = String(pkmn.type2 || "").trim().toLowerCase() || t1;
            if (t1) el.setAttribute("data-type1", t1); else el.removeAttribute("data-type1");
            if (t2) el.setAttribute("data-type2", t2); else el.removeAttribute("data-type2");
        }

        function setTypeDataAttr(el, attr, value) {
            const v = String(value || "").trim().toLowerCase();
            if (v) el.setAttribute(attr, v);
            else el.removeAttribute(attr);
        }

        // Turn a field label into a CSS-safe class, e.g. "Sp. Attack" -> "field-sp-attack"
        function fieldSlug(label) {
            let s = String(label || "")
                .normalize("NFKD")                      // strip accents (Pokédex -> Pokedex)
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .replace(/&/g, " and ")
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");
            if (!s) s = "unnamed";
            return `field-${s}`;
        }
        function addFieldNameClass(el, label) {
            if (!el) return;
            el.classList.add(fieldSlug(label));
        }

        // Make a Pokémon image clickable: wrap div.img in a button and return it
        function makeClickablePokemonImage(imgEl, p) {
            const btn = document.createElement("button");
            btn.className = "link-btn";
            btn.style.padding = "0";
            btn.style.background = "transparent";
            btn.style.border = "0";
            btn.style.color = "inherit";
            btn.style.cursor = "pointer";
            btn.setAttribute("aria-label", `Open ${p?.name || "Pokémon"} entry`);
            btn.addEventListener("click", () => openPokemonOverlay(p));

            btn.appendChild(imgEl);   // wrap the image div
            return btn;               // <-- IMPORTANT: return wrapper
        }


        function setPokemonTypeDataAttrs(el, p) {
            if (!el) return;
            if (p.type1) el.setAttribute("data-type1", String(p.type1).toLowerCase());
            else el.removeAttribute("data-type1");
            if (p.type2) el.setAttribute("data-type2", String(p.type2).toLowerCase());
            else el.removeAttribute("data-type2");
        }


        // === Double-confirm helper for dangerous actions ===
        function wireAreYouSure(btn, {
            idleLabel,
            armedLabel = "Are you sure?",
            timeoutMs = 2000,
            onConfirm
        }) {
            if (!btn) return;

            let armed = false;
            let timer = null;

            function reset() {
                armed = false;
                btn.classList.remove("danger");
                btn.textContent = idleLabel;
                if (timer) { clearTimeout(timer); timer = null; }
            }

            btn.textContent = idleLabel;
            btn.onclick = () => {
                if (!armed) {
                    armed = true;
                    btn.classList.add("danger");
                    btn.textContent = armedLabel;
                    timer = setTimeout(reset, timeoutMs);
                    return;
                }
                reset();
                onConfirm?.();
            };

            // Allow live relabelling without re-wiring
            return { reset, relabel: (newIdle) => { idleLabel = newIdle; reset(); } };
        }




        let adminActiveView = "pokemon";
        let selectedId = null;
        let leftFilter = "";
        let pokemonSortMode = "AZ"; // "AZ" | "09"
        let gameSortMode = "DATE";  // "DATE" | "AZ"

        let mainView = "search";  // "browse" | "games" | "search"

        const PKMN_IMG = (id) => `images/pkmn/${encodeURIComponent(id)}.webp`;
        const GAME_IMG = (slug) => `images/games/${encodeURIComponent(slug)}.webp`;


        function safeHtml(str) { return String(str ?? "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s])) }
        function escapeRegExp(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        // Returns HTML with <mark class="hl">…</mark> around matches (case-insensitive), safely escaped
        function highlightHTML(text, query) {
            const src = String(text ?? "");
            const q = String(query ?? "").trim();
            if (!q) return safeHtml(src);
            const escaped = safeHtml(src);
            const re = new RegExp("(" + escapeRegExp(q) + ")", "ig");
            return escaped.replace(re, '<mark class="hl">$1</mark>');
        }
        function parseAndQuery(qRaw) {
            const raw = String(qRaw || "");
            let excludes = [];

            // Extract [ ... ] block (optional)
            let rest = raw;
            const m = raw.match(/\[([^\]]*)\]/);
            if (m) {
                const inner = m[1] || "";
                excludes = excludes.concat(
                    inner.split(/[,\s]+/).map(s => s.trim()).filter(Boolean)
                );
                rest = raw.replace(m[0], " "); // remove bracket block from main query
            }

            // Split positives by '+', but also allow inline -excludes
            const parts = rest.split("+").map(s => s.trim()).filter(Boolean);
            const terms = [];
            for (const part of parts) {
                if (!part) continue;
                const bits = part.split(/\s+/);
                const kept = [];
                for (const b of bits) {
                    if (b.startsWith("-") && b.length > 1) {
                        excludes.push(b.slice(1));
                    } else {
                        kept.push(b);
                    }
                }
                if (kept.length) terms.push(kept.join(" "));
            }

            return {
                isAnd: terms.length > 1,
                terms,
                excludes
            };
        }

        function textPassesExcludes(text, excludes) {
            if (!excludes || !excludes.length) return true;
            const hay = String(text || "").toLowerCase();
            return !excludes.some(ex => hay.includes(String(ex).toLowerCase()));
        }


        function textMatchesTerms(text, terms, isAnd) {
            const hay = String(text || "").toLowerCase();
            if (!terms.length) return false;
            if (isAnd) return terms.every(t => hay.includes(t.toLowerCase()));
            return terms.some(t => hay.includes(String(t).toLowerCase()));
        }

        function highlightHTMLMulti(text, terms) {
            const src = String(text ?? "");
            if (!terms || !terms.length) return safeHtml(src);
            const escaped = safeHtml(src);
            // Longest-first alternation to avoid nested highlights
            const sorted = [...terms].sort((a, b) => b.length - a.length)
                .map(t => escapeRegExp(String(t)));
            const re = new RegExp("(" + sorted.join("|") + ")", "ig");
            return escaped.replace(re, '<mark class="hl">$1</mark>');
        }

        function numberOrNull(v) { const n = Number(v); return isNaN(n) ? null : n }
        function numOrNullFromInput(v) { if (v === "" || v === null || v === undefined) return null; const n = Number(v); return isNaN(n) ? null : n }
        function updateDatasetSummary() { document.getElementById("datasetSummary").textContent = `${DATA.pokemon.length} Pokémon • ${DATA.games.length} Games` }

        function byReleaseDateAsc(a, b) {
            const da = Date.parse(a.releaseDate || "1970-01-01");
            const db = Date.parse(b.releaseDate || "1970-01-01");
            return (isNaN(da) ? 0 : da) - (isNaN(db) ? 0 : db);
        }

        function debounce(fn, wait = 250) {
            let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
        }
        const refreshLeftList = debounce(() => renderAdminLeftList(), 250);

        function pkmnImageNameFromId(id) {
            const s = String(id ?? "").trim();
            if (/^\d+$/.test(s)) return s.padStart(4, "0");
            return s;
        }

        // ---------- image loading (memo + lazy) ----------
        const IMG_STATUS = new Map(); // url -> "ok" | "err"

        function applyBg(el, url) {
            if (!url) { el.style.backgroundImage = "none"; return; }
            el.style.backgroundImage = `url("${url}")`;
        }

        function loadBgOnce(url, onOk, onErr) {
            const status = IMG_STATUS.get(url);
            if (status === "ok") { onOk(); return; }
            if (status === "err") { onErr(); return; }
            const img = new Image();
            img.onload = () => { IMG_STATUS.set(url, "ok"); onOk(); };
            img.onerror = () => { IMG_STATUS.set(url, "err"); onErr(); };
            img.src = url; // no cache-busting here – allow browser cache
        }

        // IntersectionObserver: load when near viewport
        const lazyIO = new IntersectionObserver((entries) => {
            for (const e of entries) {
                if (!e.isIntersecting) continue;
                const el = e.target;
                lazyIO.unobserve(el);
                const url = el.dataset.bg || "";
                if (!url) return;
                loadBgOnce(
                    url,
                    () => applyBg(el, url),
                    () => { el.style.backgroundImage = "none"; }
                );
            }
        }, { root: null, rootMargin: "300px", threshold: 0.01 });

        function lazyBg(el, url) {
            if (!url) { el.style.backgroundImage = "none"; return; }
            el.dataset.bg = url;
            // Optional: low-cost placeholder stays until loaded
            lazyIO.observe(el);
        }


        function fixJsonText(text) {
            text = text.replace(/:\s*NaN\b/g, ": null");
            try {
                const tmp = JSON.parse(text);
                if (Array.isArray(tmp)) {
                    const cleaned = tmp.filter(obj => {
                        if (obj && typeof obj === "object") {
                            return Object.values(obj).some(v => v !== null && v !== "" && v !== undefined);
                        }
                        return true;
                    });
                    return JSON.stringify(cleaned);
                }
            } catch (_) { }
            return text;
        }

        function normalizeData(json) {
            const t = (v) => String(v ?? "").trim();
            const out = { games: [], pokemon: [] };

            if (Array.isArray(json.games)) {
                out.games = json.games.map(g => ({
                    id: t(g.id ?? crypto.randomUUID()),
                    title: t(g.title),
                    releaseDate: t(g.releaseDate),
                    console: t(g.console),
                    colorHex: t(g.colorHex || "#888888"),
                    imageSlug: t(g.imageSlug),
                    corpusSlug: t(g.corpusSlug)
                }));
            }

            if (Array.isArray(json.pokemon)) {
                out.pokemon = json.pokemon.map(p => {
                    // NEW: normalize pokedex into { [gameId]: { regionalDexNumber, entry } }
                    let pokedexObj = {};
                    if (Array.isArray(p.pokedex)) {
                        for (const e of p.pokedex) {
                            const gameId = String(e.version ?? e.gameId ?? "").trim();
                            if (!gameId) continue;
                            const entry = String(e.text ?? e.entry ?? "");
                            const regional = String(e.regionalDexNumber ?? e.regional ?? "").trim();
                            pokedexObj[gameId] = { regionalDexNumber: regional, entry };
                        }
                    } else if (p.pokedex && typeof p.pokedex === "object") {
                        // Also normalize any existing object-ish shapes
                        for (const [k, v] of Object.entries(p.pokedex)) {
                            const entry = String((v && (v.entry ?? v.text)) ?? "");
                            const regional = String((v && (v.regionalDexNumber ?? v.regional)) ?? "");
                            pokedexObj[String(k)] = { regionalDexNumber: regional, entry };
                        }
                    }

                    return {
                        id: String(p.id ?? p.ID ?? crypto.randomUUID()).trim(),
                        name: String(p.name ?? p.Name ?? p[" Name"] ?? "").trim(),
                        category: String(p.category ?? p.Category ?? p[" Category"] ?? "").trim(),
                        form: String(p.form ?? p.Form ?? p[" Form"] ?? "").trim(),
                        species: String(p.species ?? p.Species ?? p[" Species"] ?? "").trim(),
                        evolution: String(p.evolution ?? p.Evolution ?? "").trim(),
                        type1: String(p.type1 ?? p.Type1 ?? p[" Type1"] ?? "").trim(),
                        type2: String(p.type2 ?? p.Type2 ?? p[" Type2"] ?? "").trim(),
                        hp: numberOrNull(p.hp ?? p.HP),
                        attack: numberOrNull(p.attack ?? p.Attack),
                        defense: numberOrNull(p.defense ?? p.Defense),
                        spAtk: numberOrNull(p.spAtk ?? p["Sp Atk"] ?? p[" Sp Atk"]),
                        spDef: numberOrNull(p.spDef ?? p["Sp Def"] ?? p[" Sp Def"]),
                        speed: numberOrNull(p.speed ?? p.Speed),
                        pokedex: pokedexObj
                    };
                });
            }
            return out;
        }

        async function loadInitialData() {
            try {
                const res = await fetch("./data.json"); // allow normal HTTP caching on GitHub Pages
                if (!res.ok) throw new Error("HTTP " + res.status);
                let raw = await res.text();
                let json;
                try { json = JSON.parse(raw); } catch { raw = fixJsonText(raw); json = JSON.parse(raw); }
                DATA = Array.isArray(json) ? normalizeData({ pokemon: json, games: [] }) : normalizeData(json);
            } catch (e) {
                console.warn("Could not auto-load data.json. Use Import JSON if opening via file://", e);
            }
            updateDatasetSummary();
            renderMain();
        }



        /* ========= NOTEPAD v2 (grouped) ========= */
        function addNoteToNotepad(initialText = "", initialTitle = "Note") {
            const list = loadNotepad();
            const id = `note:${uid()}`;
            list.push({ id, kind: "note", title: String(initialTitle || "Note"), text: String(initialText || "") });
            saveNotepad(list);

            if (typeof renderNotepad === "function") {
                renderNotepad();
                // focus the new note (same as before)
                const mount = (typeof notepadBody !== "undefined") ? notepadBody : document.getElementById("notepadBody");
                const focusIt = () => {
                    const ta = mount?.querySelector(`.result.note[data-id="${id}"] textarea`);
                    if (ta) {
                        ta.focus();
                        ta.scrollIntoView({ behavior: "smooth", block: "center" });
                    }
                };
                requestAnimationFrame(() => requestAnimationFrame(focusIt));
                setTimeout(focusIt, 80);
            }
        }

        function updateNotepadNote(groupId, patch) {
            const list = loadNotepad();
            const g = list.find(x => x.id === groupId && x.kind === "note");
            if (!g) return;
            Object.assign(g, patch || {});
            saveNotepad(list);
        }

        function removeNotepadNote(groupId) {
            const list = loadNotepad().filter(x => x.id !== groupId);
            saveNotepad(list);
            if (typeof renderNotepad === "function") renderNotepad();
        }


        // Storage keys
        const NOTEPAD_KEY = "notepad_v2";
        const NOTEPAD_NOTES_KEY = "notepad_notes_v1";

        // Basic store
        function loadNotepad() {
            try { return JSON.parse(localStorage.getItem(NOTEPAD_KEY)) || []; }
            catch { return []; }
        }
        function saveNotepad(list) {
            localStorage.setItem(NOTEPAD_KEY, JSON.stringify(Array.isArray(list) ? list : []));
        }

        // Notes store (freeform textarea)
        function loadNotepadNotes() { return localStorage.getItem(NOTEPAD_NOTES_KEY) || ""; }
        function saveNotepadNotes(t) { localStorage.setItem(NOTEPAD_NOTES_KEY, String(t ?? "")); }

        function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

        // Group find/create that work on the SAME list instance
        function getOrCreateDexGroup(list, p) {
            const id = `dex:${p.id}`;
            let g = list.find(x => x.id === id && x.kind === "dex");
            if (!g) {
                g = {
                    id, kind: "dex",
                    pId: p.id, pName: p.name || "(Unnamed)",
                    pForm: p.form || "", pType1: p.type1 || "", pType2: p.type2 || "",
                    entries: []
                };
                list.push(g);
            }
            return g;
        }

        function getOrCreateCorpusGroup(list, game) {
            const id = `corpus:${game.id}`;
            let g = list.find(x => x.id === id && x.kind === "corpus");
            if (!g) {
                g = {
                    id, kind: "corpus",
                    gameId: game.id,
                    gameTitle: game.title || "(Game)",
                    gameColorHex: (game.colorHex && /^#[0-9a-f]{6}$/i.test(game.colorHex))
                        ? game.colorHex.toUpperCase() : "#888888",
                    corpusSlug: game.corpusSlug || "",
                    lines: []
                };
                list.push(g);
            }
            return g;
        }


        function pruneEmptyGroups() {
            const list = loadNotepad().filter(g =>
                g.kind === "note" ||                              // ✅ keep all notes
                (g.kind === "dex" && (g.entries?.length || 0) > 0) ||
                (g.kind === "corpus" && (g.lines?.length || 0) > 0)
            );
            saveNotepad(list);
        }


        function renderNotepadNoteCard(group) {
            // group.kind === 'note'
            const card = document.createElement("div");
            card.className = "result note";
            card.dataset.id = group.id;

            const header = document.createElement("div");
            header.className = "result-header";

            // Editable title input in the header
            const titleWrap = document.createElement("div");
            const titleInput = document.createElement("input");
            titleInput.type = "text";
            titleInput.className = "note-title-input";
            titleInput.placeholder = "Note title";
            titleInput.value = group.title || "Note";

            // debounce saves while typing
            let t1;
            titleInput.addEventListener("input", () => {
                clearTimeout(t1);
                const val = titleInput.value;
                t1 = setTimeout(() => updateNotepadNote(group.id, { title: val }), 200);
            });

            titleWrap.appendChild(titleInput);
            header.appendChild(titleWrap);

            const tools = document.createElement("div");
            const rm = document.createElement("button");
            rm.className = "btn";
            rm.title = "Remove note";
            rm.textContent = "−📓";
            rm.addEventListener("click", () => removeNotepadNote(group.id));
            tools.appendChild(rm);
            header.appendChild(tools);

            card.appendChild(header);

            // body (textarea) stays the same, but save via shared updater
            const box = document.createElement("div");
            box.className = "subsection";
            const field = document.createElement("div");
            field.className = "field";

            const ta = document.createElement("textarea");
            ta.placeholder = "Write anything…";
            ta.value = group.text || "";

            let t2;
            ta.addEventListener("input", () => {
                clearTimeout(t2);
                const val = ta.value;
                t2 = setTimeout(() => updateNotepadNote(group.id, { text: val }), 200);
            });

            field.appendChild(ta);
            box.appendChild(field);
            card.appendChild(box);

            return card;
        }


        /* ===== Adders (called by +📓 buttons) ===== */

        function addDexToNotepad({ p, game, entryText, regionalDexNumber = "" }) {
            const list = loadNotepad();                          // load ONCE
            const group = getOrCreateDexGroup(list, p);          // pass list in

            const gameColorHex = (game?.colorHex && /^#[0-9a-f]{6}$/i.test(game.colorHex))
                ? game.colorHex.toUpperCase() : "#888888";

            const exists = group.entries.some(e =>

        function setupNotepadDrag(container) {
            if (!container) return;

            const DRAGGABLE = ".result"; // dex, corpus, note cards
            let dragEl = null;

            container.querySelectorAll(DRAGGABLE).forEach(el => {
                el.setAttribute("draggable", "true");

                el.addEventListener("dragstart", (e) => {
                    dragEl = el;
                    el.classList.add("dragging");
                    // set a drag image so it's visible in some browsers
                    if (e.dataTransfer) {
                        e.dataTransfer.effectAllowed = "move";
                        e.dataTransfer.setData("text/plain", el.dataset.id || "");
                    }
                });

                el.addEventListener("dragend", () => {
                    if (dragEl) dragEl.classList.remove("dragging");
                    dragEl = null;
                    // persist the new order
                    persistNotepadOrderFromDOM(container);
                });
            });

            container.addEventListener("dragover", (e) => {
                if (!dragEl) return;
                e.preventDefault(); // allow drop
                const after = getDragAfterElement(container, e.clientY);
                if (after == null) {
                    container.appendChild(dragEl);
                } else {
                    container.insertBefore(dragEl, after);
                }
            });

            function getDragAfterElement(cont, y) {
                const els = [...cont.querySelectorAll(`${DRAGGABLE}:not(.dragging)`)];
                return els.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - (box.top + box.height / 2);
                    if (offset < 0 && offset > closest.offset) {
                        return { offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
            }
        }

        const CORPUS_CACHE = new Map(); // slug -> { lines: string[], text: string }

        async function loadCorpus(slug) {
            slug = String(slug || "").trim();
            if (!slug) return { lines: [], text: "" };
            if (CORPUS_CACHE.has(slug)) return CORPUS_CACHE.get(slug);

            const url = `corpus/${encodeURIComponent(slug)}.txt`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("HTTP " + res.status);
                // raw text (may contain literal "\n" "\r" "\c" tokens)
                const text = await res.text();

                // 1) remove actual CR characters
                // 2) split on actual newlines
                // 3) for each line, replace literal \n \r \c tokens with a space
                // 4) collapse whitespace
                const lines = text
                    .replace(/\r/g, "")
                    .split("\n")
                    .map(l =>
                        l
                            .replace(/\\[nrc]/g, " ")  // literal "\n" "\r" "\c" -> space
                            .replace(/\s+/g, " ")      // collapse
                            .trim()
                    );

                const value = { lines, text };
                CORPUS_CACHE.set(slug, value);
                return value;
            } catch (e) {
                const value = { lines: [], text: "" };
                CORPUS_CACHE.set(slug, value);
                return value;
            }
        }

        function setupGotoLine() {
            const overlay = document.querySelector('#corpusOverlay') || document;
            const input = document.getElementById('gotoLine');
            const btn = document.getElementById('gotoBtn');
            if (!overlay || !input) return;

            // Keep track of the currently highlighted element
            let lastHighlighted = null;

            function findLine(n) {
                return (
                    overlay.querySelector(`[data-line="${n}"]`) ||
                    overlay.querySelector(`#L${n}`) ||
                    overlay.querySelector(`.line[data-ln="${n}"]`) ||
                    (function () {
                        const candidates = overlay.querySelectorAll(
                            '[data-line], [data-ln], .line, .corpus_line'
                        );
                        if (!candidates.length) return null;
                        const idx = Math.max(1, Math.min(n, candidates.length)) - 1;
                        return candidates[idx] || null;
                    })()
                );
            }

            function jumpToLine(n) {
                if (!Number.isFinite(n) || n < 1) return;
                const el = findLine(n);
                if (!el) return;

                el.scrollIntoView({ block: 'center', behavior: 'smooth' });

                // Toggle persistent highlight (no animation)
                if (lastHighlighted && lastHighlighted !== el) {
                    lastHighlighted.classList.remove('line-highlight');
                }
                el.classList.add('line-highlight');
                lastHighlighted = el;
            }

            // Press Enter to jump
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const n = parseInt(input.value, 10);
                    jumpToLine(n);
                }
            });

            // Click the "Go" button to jump
            if (btn) {
                btn.addEventListener('click', () => {
                    const n = parseInt(input.value, 10);
                    jumpToLine(n);
                });
            }

            // Auto-focus when overlay opens
            const observer = new MutationObserver(() => {
                if (overlay.classList.contains('open')) {
                    input.focus();
                    input.select();
                }
            });
            observer.observe(overlay, { attributes: true, attributeFilter: ['class'] });
        }

                    let relevancy = 0;
                    const fieldMatches = [];

                    const fields = {
                        id: p.id, name: p.name, category: p.category, form: p.form, species: p.species,
                        evolution: p.evolution, type1: p.type1, type2: p.type2
                    };
                    const combined = Object.values(fields).map(v => String(v || "")).join(" | ");
                    if (!textPassesExcludes(combined, excludes)) continue;

                    if (isAnd) {
                        const qualifies = textMatchesTerms(combined, terms, /*AND*/ true);
                        if (!qualifies) continue;
                    }

                    for (const [k, v] of Object.entries(fields)) {
                        const s = String(v || "");
                        if (s && textMatchesTerms(s, terms, /*OR*/ false)) {
                            relevancy++;

                    }

                    // Pokédex entries
                    const pdx = p.pokedex || {};
                    const dexMatchesByText = new Map();
                    for (const [gameId, obj] of Object.entries(pdx)) {

                            const g = gameById[gameId];

        // Shared ID sort (0–9 + suffix so 9, 9GM, 9M etc.)
        function parseIdForSort(raw) {
            const id = (raw || "").toString().trim();
            const m = id.match(/^(\d+)(.*)$/);
            if (m) return { num: parseInt(m[1], 10), suffix: m[2] || "" };
            return { num: Number.POSITIVE_INFINITY, suffix: id };
        }
        function idComparator(a, b) {
            const A = parseIdForSort(a.id), B = parseIdForSort(b.id);
            if (A.num !== B.num) return A.num - B.num;
            if (A.suffix === B.suffix) return 0;
            if (A.suffix === "") return -1;
            if (B.suffix === "") return 1;
            return A.suffix.localeCompare(B.suffix, undefined, { sensitivity: "base" });
        }

        function renderSearch() {

            // Scopes: Pokémon + Corpus (both checked by default)
            const scopes = document.createElement("div");
            scopes.className = "search-scopes";

            function makeScope(id, text, defaultChecked = true) {
                const label = document.createElement("label");
                label.className = "scope";
                label.style.display = "inline-flex";
                label.style.alignItems = "center";
                label.style.gap = "6px";
                label.style.cursor = "pointer";

                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.id = id;

                // Set BOTH the property and the attribute so CSS selectors like [checked] work.
                if (defaultChecked) {
                    cb.checked = true;
                    cb.setAttribute("checked", "");
                    cb.setAttribute("aria-checked", "true");
                } else {
                    cb.removeAttribute("checked");
                    cb.setAttribute("aria-checked", "false");
                }

                // Guard against aggressive CSS
                cb.style.pointerEvents = "auto";
                cb.addEventListener("change", () => {
                    if (cb.checked) {
                        cb.setAttribute("checked", "");
                        cb.setAttribute("aria-checked", "true");
                    } else {
                        cb.removeAttribute("checked");
                        cb.setAttribute("aria-checked", "false");
                    }
                    // If there's already a query, re-run the search live
                    if ((input.value || "").trim()) doSearch();
                });

                const span = document.createElement("span");
                span.textContent = text;

                // Wrap input inside label so the whole label is clickable
                label.appendChild(cb);
                label.appendChild(span);
                return { label, cb };
            }

            const { label: pokeLabel, cb: cbPoke } = makeScope("scopePokemon", "Pokemon", true);
            const { label: corpusLabel, cb: cbCorpus } = makeScope("scopeCorpus", "Corpus", true);

                const includePokemon = !!cbPoke.checked;

                ].filter(Boolean).join(" + ");

        function renderAdminLeftList() {
            const list = document.getElementById("leftList");
            list.innerHTML = "";
            let source;

            if (adminActiveView === "pokemon") {
                source = DATA.pokemon.slice();
                // Respect current mode (default is 0–9)
                if (pokemonSortMode === "AZ") {
                    source.sort((a, b) => (a.name || "").localeCompare((b.name || ""), undefined, { sensitivity: "base" }));
                } else {
                    source.sort(idComparator);
                }
            } else {
                source = DATA.games.slice();
                if (gameSortMode === "AZ") {
                    source.sort((a, b) => (a.title || "").localeCompare((b.title || ""), undefined, { sensitivity: "base" }));
                } else {
                    source.sort(byReleaseDateAsc);

            }

            const filtered = source.filter(item => {
                const key = (adminActiveView === "pokemon"
                    ? `${item.name} ${item.form || ""} ${item.id} ${item.species}`.toLowerCase()
                    : `${item.title} ${item.console} ${item.releaseDate}`.toLowerCase()
                );
                return key.includes(leftFilter);
            });

            for (const item of filtered) {
                const itemId = (adminActiveView === "pokemon" ? (item.id || item._tempId) : item.id);

                const div = document.createElement("div");

                    const slug = (item.imageSlug || "").trim();

        function makeField(label, type, value, onChange, opts = {}) {
            const container = document.createElement("div"); container.className = "field";
            container.classList.add(opts.className || fieldSlug(label)); // ← add name class
            const lab = document.createElement("label"); lab.textContent = label; container.appendChild(lab);
            let input;
            if (type === "select") {
                input = document.createElement("select");
                for (const opt of (opts.options || [])) {
                    const o = document.createElement("option"); o.value = opt; o.textContent = opt || "—"; if (String(value) === String(opt)) o.selected = true;
                    input.appendChild(o);
                }
            } else if (type === "textarea") {
                input = document.createElement("textarea"); input.value = value || "";
            } else {
                input = document.createElement("input"); input.type = type; if (value !== null && value !== undefined) input.value = String(value);
            }
            input.addEventListener("input", () => onChange(type === "number" ? numOrNullFromInput(input.value) : input.value));
            container.appendChild(input);
            return { container, input };
        }

            const hero = document.createElement("div");
            hero.className = "game-img";
            if (game.imageSlug) lazyBg(hero, GAME_IMG(game.imageSlug));

            header.appendChild(headTop);
            header.appendChild(meta);
            header.appendChild(hero);

            // Filter Pokémon that have an entry OR a regional dex number for this game
            const filtered = DATA.pokemon.filter(p => {
                const pd = p.pokedex?.[game.id];
                if (!pd) return false;
                const hasEntry = !!(pd.entry && String(pd.entry).trim());
                const hasRegional = !!(pd.regionalDexNumber && String(pd.regionalDexNumber).trim());
                return hasEntry || hasRegional;
            });

            // Sort: regional dex number (numeric, missing last), then name
            filtered.sort((a, b) => {
                const ad = parseInt(a.pokedex?.[game.id]?.regionalDexNumber || "", 10);
                const bd = parseInt(b.pokedex?.[game.id]?.regionalDexNumber || "", 10);
                const aHas = !isNaN(ad), bHas = !isNaN(bd);
                if (aHas && bHas && ad !== bd) return ad - bd;
                if (aHas !== bHas) return aHas ? -1 : 1;
                return (a.name || "").localeCompare(b.name || "", undefined, { sensitivity: "base" });
            });

            // Grid like Browse
            // Grid like Browse (same structure/behaviour)
            const grid = document.createElement("div");
            grid.className = "grid pokemon";

            for (const p of filtered) {
                const card = document.createElement("div");
                card.className = "card";
                setTypeData(card, p);

                // Make entire card clickable (same as main Browse)
                card.style.cursor = "pointer";
                card.setAttribute("role", "button");
                card.tabIndex = 0;
                const open = () => openPokemonOverlay(p);
                card.addEventListener("click", open);
                card.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
                });

                // Image
                const img = document.createElement("div");
                img.className = "img";
                lazyBg(img, PKMN_IMG(p.id));
                card.appendChild(img);

                // Title (same layout as Browse: strong name + optional form)
                const title = document.createElement("div");
                const nameEl = document.createElement("strong");
                nameEl.textContent = p.name || "(Unnamed)";
                title.appendChild(nameEl);

                if (p.form) {
                    title.appendChild(document.createTextNode(" "));
                    const formSpan = document.createElement("span");
                    formSpan.className = "muted";
                    formSpan.textContent = p.form;
                    title.appendChild(formSpan);
                }

                // Meta row (regional dex # for this game + type pills)
                const meta = document.createElement("div");
                meta.className = "row muted";
                const pd = p.pokedex?.[game.id] || {};
                const dexNo = (pd.regionalDexNumber && String(pd.regionalDexNumber).trim())
                    ? `#${pd.regionalDexNumber}` : "—";

                let typeHTML = "";
                if (p.type1 && p.type2) {
                    typeHTML = `<p class="pill pill-types">
      <span data-type1="${safeHtml(p.type1.toLowerCase())}">${safeHtml(p.type1)}</span>
      <span data-type2="${safeHtml(p.type2.toLowerCase())}">${safeHtml(p.type2)}</span>
    </p>`;
                } else if (p.type1) {
                    typeHTML = `<p class="pill pill-types">
      <span data-type1="${safeHtml(p.type1.toLowerCase())}">${safeHtml(p.type1)}</span>
    </p>`;
                } else {
                    typeHTML = `<p class="pill">—</p>`;
                }

                meta.innerHTML = `<span class="pill">${safeHtml(dexNo)}</span>${typeHTML}`;

                // Assemble card
                card.appendChild(title);
                card.appendChild(meta);
                grid.appendChild(card);
            }

            mainEl.innerHTML = "";
            mainEl.appendChild(header);
            mainEl.appendChild(grid);

        }


        // Kick off
        loadInitialData();
    </script>
</body>

</html>
